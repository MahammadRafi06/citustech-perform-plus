apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perform-plus-release
  namespace: perform-plus
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [ui, api]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perform-plus-release
  namespace: perform-plus
subjects:
  - kind: Group
    name: perform-plus-release
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: perform-plus-release
  apiGroup: rbac.authorization.k8s.io
