# Copy, replace the host/class/TLS secret, then add to kustomization.yaml.
# Also set CT_ALLOWED_ORIGINS=https://your-host and CT_SECURE_COOKIE=true.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: perform-plus
  namespace: perform-plus
spec:
  ingressClassName: nginx
  tls:
    - hosts: [perform-plus.example.test]
      secretName: perform-plus-tls
  rules:
    - host: perform-plus.example.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: {number: 8000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port: {number: 3000}
